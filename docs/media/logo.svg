<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Murmur logo">
  <title>Murmur</title>
  <!-- Voice becomes a note: waveform bars (record red) turn into note lines (accent blue),
       edged by the accent rule the app draws beside each SOAP section. -->
  <rect width="120" height="120" rx="28" fill="#0E191C"/>
  <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#24363C" stroke-width="1.5"/>
  <g stroke-linecap="round" stroke-width="7">
    <line x1="22" y1="53" x2="22" y2="67" stroke="#FF6B5E" stroke-opacity="0.55"/>
    <line x1="33" y1="42" x2="33" y2="78" stroke="#FF6B5E" stroke-opacity="0.75"/>
    <line x1="44" y1="33" x2="44" y2="87" stroke="#FF6B5E"/>
    <line x1="55" y1="45" x2="55" y2="75" stroke="#FF6B5E"/>
  </g>
  <line x1="68" y1="34" x2="68" y2="86" stroke="#93A9FF" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#93A9FF" stroke-linecap="round" stroke-width="6">
    <line x1="78" y1="40" x2="100" y2="40"/>
    <line x1="78" y1="53.3" x2="96" y2="53.3" stroke-opacity="0.8"/>
    <line x1="78" y1="66.6" x2="100" y2="66.6" stroke-opacity="0.8"/>
    <line x1="78" y1="80" x2="90" y2="80" stroke-opacity="0.8"/>
  </g>
</svg>
